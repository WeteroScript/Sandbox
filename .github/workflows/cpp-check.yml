name: C++ desktop checks

on:
  push:
    branches:
      - main
    paths:
      - "CppProject/**"
      - ".github/workflows/cpp-check.yml"
  pull_request:
    paths:
      - "CppProject/**"
      - ".github/workflows/cpp-check.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxinerama-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libusb-1.0-0-dev

      - name: Configure C++ project
        run: cmake -S CppProject -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build desktop game and tests
        run: cmake --build build --parallel 2

      - name: Run physics regression tests
        run: ctest --test-dir build --output-on-failure
