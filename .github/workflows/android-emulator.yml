name: Android emulator smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CppProject/**"
      - ".github/workflows/android-emulator.yml"
  push:
    branches:
      - main
    paths:
      - "CppProject/**"
      - ".github/workflows/android-emulator.yml"

permissions:
  contents: read

jobs:
  emulator-smoke-test:
    name: Build and launch on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1 emulator"

      - name: Export Android SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build emulator-compatible debug APK
        working-directory: CppProject/android-project
        run: ./gradlew --no-daemon assembleDebug -PciEmulator=true

      - name: Launch app and capture emulator diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -u
            mkdir -p artifacts
            APK="CppProject/android-project/app/build/outputs/apk/debug/app-debug.apk"

            adb wait-for-device
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.weteroscript.sandbox
            adb shell monkey -p com.weteroscript.sandbox 1
            sleep 20

            adb exec-out screencap -p > artifacts/emulator-screen.png
            adb logcat -d -v time > artifacts/logcat.txt
            adb shell dumpsys activity activities > artifacts/activities.txt

            if ! adb shell pidof com.weteroscript.sandbox > artifacts/app-pid.txt; then
              echo "App process is not running after launch." | tee artifacts/smoke-test-result.txt
              exit 1
            fi

            if grep -E "FATAL EXCEPTION|Fatal signal" artifacts/logcat.txt; then
              echo "Crash signature found in logcat." | tee artifacts/smoke-test-result.txt
              exit 1
            fi

            echo "PASS: app process remained alive for 20 seconds." | tee artifacts/smoke-test-result.txt

      - name: Upload emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload emulator debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-emulator-debug-apk
          path: CppProject/android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
