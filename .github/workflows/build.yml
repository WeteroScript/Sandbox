name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build debug APK with cargo-quad-apk
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/root/src" \
            -w /root/src \
            notfl3/cargo-apk \
            sh -lc 'yes | /opt/android-sdk-linux/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk-linux "platforms;android-34" && cargo quad-apk build'

      - name: Collect APK
        run: |
          mkdir -p artifacts
          test -f target/android-artifacts/debug/apk/sandbox.apk
          cp target/android-artifacts/debug/apk/sandbox.apk artifacts/sandbox-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-debug-apk
          path: artifacts/sandbox-debug.apk
          if-no-files-found: error
          retention-days: 14
