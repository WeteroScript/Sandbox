name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.95.0 and Android target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add aarch64-linux-android

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;28.2.13676358"

      - name: Export Android SDK and NDK paths
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Rust-1.95-compatible cargo-quad-apk
        run: cargo install --git https://github.com/hoklims/cargo-quad-apk cargo-quad-apk --locked --force

      - name: Build debug APK
        run: cargo quad-apk build

      - name: Collect APK
        run: |
          set -euo pipefail
          APK="$(find target/android-artifacts -path '*/apk/*.apk' ! -name '*_unaligned.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced"
            find target/android-artifacts -maxdepth 5 -type f || true
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/sandbox-debug.apk
          ls -lh artifacts/sandbox-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-debug-apk
          path: artifacts/sandbox-debug.apk
          if-no-files-found: error
          retention-days: 14
