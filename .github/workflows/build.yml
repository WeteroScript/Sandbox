name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build debug APK
        run: cargo apk build --target aarch64-linux-android

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find target -type f -name "*.apk" -print -exec cp {} artifacts/sandbox-debug.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-debug-apk
          path: artifacts/sandbox-debug.apk
          if-no-files-found: error
          retention-days: 14