plugins {
    id "com.android.application"
}

android {
    namespace "com.weteroscript.sandbox"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.weteroscript.sandbox"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "0.2.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_PLATFORM=android-23", "-DANDROID_STL=c++_shared"
                targets "main"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    lint {
        abortOnError false
    }
}
